<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#08090b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" />
    <meta name="description" content="Motiq: training, readiness and communication for athletes and coaches." />
    <title>Motiq</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Motiq" />

  </head>
  <body>
    <script>
      // If the app can't start (a file failed to load or crashed), show a way out instead of a blank page.
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) { if (e.error || (e.target && e.target.tagName === 'SCRIPT')) errs.push(e.message || (e.target && e.target.src) || 'error'); }, true);
        setTimeout(function () {
          if (window.__booted) return;
          var v = document.getElementById('view');
          if (!v) return;
          v.innerHTML = '<div class="welcome" style="max-width:520px"><h1 class="page-title">Motiq didn’t start</h1>' +
            '<p class="muted">Your data is still saved on this device. This is usually a bad connection or an update landing halfway.</p>' +
            '<p><button class="btn btn-primary" onclick="location.reload()">Reload</button></p>' +
            '<details><summary class="small muted">Details</summary><pre class="small" style="white-space:pre-wrap">' + (errs.join('\n') || 'Timed out while loading').replace(/</g, '&lt;') + '</pre></details></div>';
        }, 10000);
      })();
    </script>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="bg-fx" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a2b"/><stop offset="1" stop-color="#ff2e7e"/></linearGradient></defs><path d="M4 22 L11 10 L16 18 L21 8 L28 22" /></svg>
          <span>Motiq</span>
        </div>
        <div id="side-search"></div>
        <nav class="side-nav" id="tabs"></nav>
        <div class="side-foot" id="side-foot"></div>
      </aside>
      <div class="content">
        <header class="topbar">
          <div class="brand">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 22 L11 10 L16 18 L21 8 L28 22" /></svg>
            <span>Motiq</span>
          </div>
          <div class="topbar-controls" id="role-bar"></div>
        </header>
        <nav class="subnav" id="subnav" aria-label="Section"></nav>
        <main id="view" tabindex="-1"></main>
      </div>
    </div>
    <nav class="bottombar" id="bottombar" aria-label="Main navigation"></nav>
    <div class="more-sheet" id="more-sheet" hidden><div class="more-panel" id="more-panel" role="dialog" aria-modal="true" aria-label="More"></div></div>

    <dialog id="workout-dialog">
      <form id="workout-form" method="dialog">
        <div class="row dialog-title-row"><h2 id="workout-dialog-title" style="margin:0">Log workout</h2><div class="spacer"></div><button type="button" class="btn btn-sm" data-smart="voice">🎙 Say it instead</button></div>
        <div class="grid-2">
          <label>Date <input type="date" name="date" required /></label>
          <label>Activity <select name="sport" id="sport-select"></select></label>
        </div>
        <div class="grid-2">
          <label class="span-all">Title <input name="title" placeholder="e.g. Tempo run" maxlength="80" /></label>
          <label data-session-type hidden>Session type
            <select name="sessionType"><option value="">—</option></select>
          </label>
        </div>
        <div class="grid-2">
          <label>Duration (min) <input type="number" name="duration" min="1" step="1" required /></label>
          <label>Effort (RPE 1–10) <input type="number" name="rpe" min="1" max="10" step="1" value="6" required /></label>
          <label data-endurance><span>Distance (<span data-unit="distance">mi</span>)</span> <input type="number" name="distance" min="0" step="any" /></label>
          <label data-elevation><span>Elevation gain (<span data-unit="elevation">ft</span>)</span> <input type="number" name="elevation" min="0" step="any" /></label>
        </div>
        <p class="hint" id="rpe-hint"></p>
        <fieldset data-strength hidden>
          <legend>Exercises</legend>
          <div id="exercise-rows"></div>
          <button type="button" class="btn btn-ghost" data-action="add-exercise">+ Add exercise</button>
        </fieldset>
        <label>Notes <textarea name="notes" rows="2" maxlength="500"></textarea></label>
        <fieldset>
          <legend>Video (optional)</legend>
          <label class="file-pick">
            <input type="file" name="video" accept="video/*" />
            <span class="btn btn-sm">🎥 Choose video</span>
            <span class="muted file-name" data-file-name>No video selected</span>
          </label>
          <label class="check"><input type="checkbox" name="sendToCoach" checked /> Send to my coach for review</label>
        </fieldset>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" data-action="close-dialog">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="checkin-dialog" class="wide">
      <form id="checkin-form" method="dialog">
        <h2>Daily check-in</h2>
        <div class="checkin-layout">
          <section>
            <h3>Where are you sore?</h3>
            <p class="hint">Tap an area once for mild, twice for sore, three times for pain. Tap again to clear.</p>
            <div id="checkin-body"></div>
            <div id="checkin-areas" class="chips"></div>
          </section>
          <section>
            <div class="grid-2">
              <label>Sleep (hours) <input type="number" name="sleep" min="0" max="14" step="0.25" value="7.5" required /></label>
              <label>Resting HR (bpm) <input type="number" name="restingHR" min="25" max="220" step="1" /></label>
              <label>HRV (rMSSD, ms) <input type="number" name="hrv" min="5" max="300" step="1" placeholder="optional" /></label>
            </div>
            <div class="scales">
              <label>Sleep quality <input type="range" name="sleepQuality" min="1" max="5" value="3" /><span class="scale-ends"><span>Poor</span><span>Great</span></span></label>
              <label>Stress <input type="range" name="stress" min="1" max="5" value="2" /><span class="scale-ends"><span>Calm</span><span>Stressed</span></span></label>
              <label>Mood / energy <input type="range" name="mood" min="1" max="5" value="4" /><span class="scale-ends"><span>Low</span><span>Great</span></span></label>
              <label><span>Body weight (<span data-unit="weight">lb</span>)</span> <input type="number" name="weight" min="0" step="any" /></label>
            </div>
            <div class="scales">
              <label>Hydration <input type="range" name="hydration" min="1" max="5" value="3" /><span class="scale-ends"><span>Thirsty</span><span>Well hydrated</span></span></label>
              <label>Fuel (yesterday) <input type="range" name="fuel" min="1" max="5" value="3" /><span class="scale-ends"><span>Barely ate</span><span>Ate well</span></span></label>
            </div>
            <fieldset id="cycle-fields" hidden><legend>Cycle (private)</legend>
              <label class="check"><input type="checkbox" name="period" /> Period today</label>
              <div class="row">
                <label class="day-pick"><input type="checkbox" name="symptoms" value="cramps"/><span>Cramps</span></label>
                <label class="day-pick"><input type="checkbox" name="symptoms" value="fatigue"/><span>Fatigue</span></label>
                <label class="day-pick"><input type="checkbox" name="symptoms" value="headache"/><span>Headache</span></label>
                <label class="day-pick"><input type="checkbox" name="symptoms" value="bloating"/><span>Bloating</span></label>
                <label class="day-pick"><input type="checkbox" name="symptoms" value="mood"/><span>Mood changes</span></label>
              </div>
            </fieldset>
            <label>Anything your coach should know? <textarea name="note" rows="2" maxlength="500" placeholder="e.g. Knee hurts on landings"></textarea></label>
          </section>
        </div>
        <input type="hidden" name="date" />
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" data-action="close-dialog">Cancel</button>
          <button type="submit" class="btn btn-primary">Save check-in</button>
        </div>
      </form>
    </dialog>

    <dialog id="video-dialog" class="wide">
      <div class="row" style="margin-bottom: 0.5rem">
        <h2 id="video-title" style="margin: 0">Video</h2>
        <div class="spacer"></div>
        <button type="button" class="btn btn-sm btn-ghost" data-action="close-dialog" aria-label="Close">✕</button>
      </div>
      <video id="video-player" controls playsinline></video>
      <div class="row"><p class="muted" id="video-caption" style="margin:.5rem 0"></p><div class="spacer"></div>
        <button class="btn btn-sm" id="video-analyze" data-form-action="analyze-video" hidden>📐 Analyze form</button></div>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
