<!doctype html><html><head><meta charset="utf-8"><style>
body{font:12px system-ui;background:#fff;color:#111;margin:8px}.row{display:flex;gap:4px;align-items:center;margin:2px 0}
.row b{width:150px;font-size:11px}canvas{width:150px;height:110px;border:1px solid #ddd}
:root{--surface-2:#f4f5f7;--text:#111;--border:#9aa3b0;--info:#3b6fd8;--bg:#fff}</style></head><body><div id="out"></div>
<script src="../src/demos-recovery.js"></script><script src="../src/exercise-demo.js"></script><script>
const ids=(new URLSearchParams(location.search).get('ids')||'').split(',').filter(Boolean);
const out=document.getElementById('out');
for(const id of ids){const r=document.createElement('div');r.className='row';r.innerHTML='<b>'+id+'</b>';out.append(r);
 const sp=ExerciseDemo.DEMOS[id];if(!sp){r.innerHTML+=' MISSING';continue}
 for(const u of [0,.2,.4,.6,.8]){const c=document.createElement('canvas');r.append(c);ExerciseDemo.draw(c,ExerciseDemo.frame(id,u*sp.sec),{big:false});}}
</script></body></html>
